packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@eslint/js": ^10.0.1
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.102.8
  "@trpc/client": ^11.18.0
  "@trpc/server": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@types/node": ^24.0.0
  "@types/pg": ^8.23.1
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  eslint: ^10.9.1
  pg: ^8.23.0
  prettier: ^3.9.6
  tailwindcss: ^4.3.3
  typescript: ^5.9.3
  zod: ^4.6.7

catalogs:
  react19:
    "@types/react": ~19.2.0
    "@types/react-dom": ~19.2.0
    react: 19.2.8
    react-dom: 19.2.8

linkWorkspacePackages: true

# Supply chain (PLAN-2026-09-SECURITY-REMEDIATION F10.2): only resolve package
# versions published at least 24 h ago, so a freshly hijacked release is
# usually yanked before it can reach the lockfile.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - "@sentry/cli"
  - "@tailwindcss/oxide"
  - core-js-pure
  - esbuild
  - sharp

overrides:
  "@humanfs/node": ^0.16.8
  "@types/minimatch": 5.1.2
  "@vitest/mocker": ">=4.1.12"
  baseline-browser-mapping: ">=2.11.0"
  brace-expansion: ">=5.0.12 <6.0.0"
  esbuild: ^0.25.0
  fast-uri: ">=3.1.9"
  flatted: ^3.4.2
  handlebars: ^4.7.9
  js-yaml: ^4.3.1
  lightningcss: 1.30.1
  lodash: ^4.18.0
  picomatch: ^4.0.4
  postcss: ">=8.5.12 <9.0.0"
  smol-toml: ">=1.9.1"
  source-map-js: ">=1.2.2"
  tmp: ^0.2.6
  vite: ^7.3.7
  ws: ^8.21.0
  yaml: ^2.8.3
  zod: ">=4.6.7"

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
