packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@eslint/js": ^10.0.1
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.102.8
  "@trpc/client": ^11.18.0
  "@trpc/server": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@types/node": ^24.0.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  eslint: ^10.9.1
  prettier: ^3.9.6
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  zod: ^4.5.4

catalogs:
  react19:
    "@types/react": ~19.2.0
    "@types/react-dom": ~19.2.0
    react: 19.2.8
    react-dom: 19.2.8

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - core-js-pure
  - esbuild
  - sharp

overrides:
  "@types/minimatch": 5.1.2
  lightningcss: 1.30.1

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
